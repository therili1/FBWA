# Світи, де працює зимова система
worlds:
  - world

temperature:
  min: -25          # найхолодніше на базовій шкалі
  max: 6            # найтепліше (+6: сніг тане швидше)
  smooth-days: 3    # чим більше, тим повільніше "фронт" погоди дрейфує між днями
  daily-swing: 8    # добовий розмах (± градусів): вночі холодніше, вдень тепліше
  comfort: 22       # комфортна температура (стеля обігріву)

# Відрізки доби (для прогнозу та опадів). from - тік доби (0 = 06:00, 6000 = 12:00, 12000 = 18:00, 18000 = 00:00).
# Перший відрізок має починатися з 0.
slots:
  - { name: "Ранок", from: 0 }
  - { name: "День",  from: 6000 }
  - { name: "Вечір", from: 12000 }
  - { name: "Ніч",   from: 18000 }

forecast:
  days: 9                      # скільки днів показує /forecast (сьогодні + наступні)
  change-recovery-days: 3      # за скільки днів погода повертається до звичайної після /forecast change

# Мінімальна температура залежить від теплоти біому за ванільною шкалою
# (сніжні 0.0, тайга 0.25, ліс 0.7, рівнина 0.8, джунглі 0.95, савана/пустеля/бедленд 2.0).
biomes:
  cold-below: 0.35
  warm-from: 0.9
  cold-min: -32
  temperate-min: -22
  warm-min: -18
  overrides: {}                # окремі біоми, наприклад:  "minecraft:desert": -15

precipitation:
  control-weather: true        # плагін сам вмикає/вимикає опади за прогнозом
  snow-chance: 0.30            # шанс снігу на відрізок
  blizzard-chance: 0.03        # шанс природної хуртовини на відрізок (рідко)
  snow-temp-modifier: -1       # на скільки градусів холодніше під час снігу
  blizzard-temp-modifier: -4   # на скільки градусів холодніше під час хуртовини
  forced-blizzard-temp-modifier: -8  # те саме, але для примусової хуртовини (/forecast storm on)

cold:
  grace-seconds: 15            # скільки секунд можна мерзнути, поки не піде шкода
  base-interval-seconds: 10.0  # інтервал між ударами = це / інтенсивність
  min-interval-seconds: 1.0    # найчастіші удари
  max-interval-seconds: 20.0   # найрідші удари
  damage: 1.0                  # шкода за удар (1.0 = пів серця)
  frost-overlay: true          # ванільний "паморозь" на екрані
  actionbar: true              # показувати температуру і тепло над хотбаром
  safe-above: 18               # від цієї температури в приміщенні грілка вже не потрібна
  feel-warm-seconds: 6         # як швидко гравець "відтає"
  feel-cool-seconds: 12        # як швидко "промерзає"
  slowdown: true               # на останній стадії переохолодження гравець сповільнюється
  slowdown-stage: 0.75         # з якої частки паморозі (0..1) починається сповільнення
  hunger-exhaustion-per-second: 0.08  # коли мерзнеш, їжа витрачається швидше (0 = вимкнути; 4.0 = 1 пункт голоду)

# Мокрий одяг: після води холодніше, поки не висохнеш (біля вогню або в теплі сохнеш швидше).
# Металева броня (залізна, золота, кольчуга, алмазна, незеритова, мідна, черепашачий шолом) не мокне:
# вода стікає. Штраф залежить від того, скільки слотів без металу (порожні або шкіряні).
wet:
  enabled: true
  seconds: 45                  # скільки тримається мокрість після виходу з води
  penalty: 1.5                 # скільки "очок тепла" додатково треба при повній мокрості без металевої броні
  dry-near-heat: 0.5           # наскільки швидше сохнеш біля вогню (на кожен градус тепла)

# Теплиця: рослини ростуть залежно від температури в їхньому блоці (надворі + тепло від печей).
greenhouse:
  enabled: true
  min-temp: 3                  # нижче цього рослини не ростуть
  good-temp: 15                # від цього ростуть з повною швидкістю

shelter:
  max-bonus: 4                 # стіни + дах без вогню дають лише до +4°
  cave-bonus: 14               # глибоко під землею до +14°

# Тепло від вогню. Тепло розтікається по повітрю від джерела: стіни, дах і двері його тримають,
# дірки та відкрите небо випускають. Маленька закрита кімната з пічкою гріється до комфорту,
# велика зала потребує кількох джерел, а на вулиці вогонь гріє лише поруч.
heat:
  update-seconds: 2            # як часто перераховувати (потрібен рестарт)
  warmup-seconds: 30           # як довго розгорається джерело
  cooldown-seconds: 40         # ВІДКРИТЕ приміщення: до повного остигання (до зовнішньої температури) за стільки секунд
  sealed-cooldown-seconds: 1200 # ЗАКРИТЕ приміщення: половина тепла за 600 с, повністю до зовнішньої за 1200 с
  decay-blocks: 10             # за скільки блоків тепло слабшає в e разів (лише в закритих просторах; у відкритому тепло згасає швидко)
  conductors:                  # провідні блоки: тепло проходить крізь них (з більшими втратами)
    - OAK_PLANKS
    - SPRUCE_PLANKS
    - BIRCH_PLANKS
    - JUNGLE_PLANKS
    - ACACIA_PLANKS
    - DARK_OAK_PLANKS
    - MANGROVE_PLANKS
    - CHERRY_PLANKS
    - BAMBOO_PLANKS
    - CRIMSON_PLANKS
    - WARPED_PLANKS
  max-cells: 700               # обсяг приміщення для ОДНІЄЇ печі (захист від лагів)
  reach-per-furnace: 3         # +стільки блоків дальності за кожну додаткову запалену піч у групі (і +max-cells на піч)
  # Печі, що торкаються гранями (і ланцюжком через інші печі), працюють як одна група:
  # потужність складається, а дальність і обсяг росте з їх кількістю. Багаття завжди окремо.
  sources:                     # power - обігрів приміщення, radiant - тепло поруч з вогнем
    FURNACE:       { power: 450, radiant: 5 }
    BLAST_FURNACE: { power: 520, radiant: 6 }
    SMOKER:        { power: 380, radiant: 4 }
    CAMPFIRE:      { power: 220, radiant: 9 }
    SOUL_CAMPFIRE: { power: 200, radiant: 8 }

campfire:
  debug: false                # логувати паливо багаття при підпалі і згасанні (для пошуку бага)
  place-unlit: true            # ванільне багаття ставиться погашеним
  fuel-cap-seconds: 600        # максимум палива (10 хв)
  stick-seconds: 30            # +30 с за паличку
  coal-seconds: 180            # +3 хв за вугілля / деревне вугілля
  unknown-lit-seconds: 300     # скільки горить багаття, що вже було запалене (з генерації світу)
  exposed-burn-multiplier: 3   # у сніг/хуртовину без даху згорає в стільки разів швидше

snow:
  enabled: true
  max-layers: 10               # 10 шарів = 1.25 блока (8 шарів стають блоком снігу + шари зверху)
  radius: 32                   # навколо гравця, де сніг накопичується й тане
  samples-per-second: 60       # швидкість накопичення (випадкових колонок за секунду на гравця)
  blizzard-multiplier: 2.5     # у хуртовину сніжить у стільки разів швидше
  melt-samples-per-second: 30  # швидкість танення при 0..+2°
  particles: true              # у теплих біомах ванільний клієнт не малює сніг: сиплемо сніжинки самі
  storm-particles: 120          # сніжинок за 4 тіки у хуртовину (більше = густіше, але важче)
  storm-radius: 24              # радіус навколо гравця, де сиплються сніжинки під час хуртовини

heater:
  duration-seconds: 600        # скільки тримає грілка (10 хв)
  magma-duration-seconds: 1800 # магматична грілка (30 хв)
  lore-update-seconds: 30      # як часто записувати залишок в предмет (рідше = менше звуків екіпіровки)
  discover-recipe-on-join: true

# Генерація світу: одиночні шари снігу в нових чанках (старий світ не змінюється)
worldgen:
  snow:
    enabled: true
    chance: 1.0                # шанс шару на кожній колонці поверхні в новому чанку (1.0 = кожна колонка)
    all-biomes: true           # true = сніг у всіх біомах (включно з теплими); false = пропускати теплі
  ice:
    enabled: false             # повне замерзання при генерації вимкнено: річка замерзає фронтом від берегів

# Вітер: на відкритому місці під час хуртовини відчувається холодніше (градусів)
wind:
  chill-degrees: 6

# Лід: річки й озера замерзають фронтом від берегів (один шар за цикл) нижче freeze-below, тануть вище thaw-above
ice:
  enabled: true
  freeze-below: -5
  thaw-above: 0
  radius: 20                   # навколо гравця, де перевіряється вода
  max-per-tick: 300            # запобіжник від лагів: скільки блоків змінювати за один цикл

# Власний білий список (/wl). Ніки в plugins/FinalBreachWinter/whitelist.txt
access:
  enabled: true
  message: "Пройдіть реєстрацію у https://discord.gg/dX5AdDfC8q"

# Напої: варіння в казані над багаттям (рецепти нижче), термос на порції
drinks:
  sips: 4                      # ковтків у термосі
  fill-min-temp: 40            # мінімальна температура напою, щоб налити в термос
  min-effect-temp: 40          # нижче цієї температури напій не дає ефектів
  brew-seconds: 20             # скільки секунд варити над запаленим багаттям
  max-ingredients: 4           # скільки інгредієнтів у казані
  coffee-saturation:
    level: 5                   # рівень ситості, яку дає кава (1-5)
    interval-seconds: 2        # як часто подавати ситість
    duration-seconds: 10       # скільки секунд триває ефект
  recipes:
    hot_chocolate:
      name: "Гарячий шоколад"
      ingredients: [MILK_BUCKET, COCOA_BEANS, COCOA_BEANS, SUGAR]
      power: 2.0               # шарів тепла при питті (як шкіряна броня = 1)
      seconds: 180             # скільки тримає тепло
    herbal_tea:
      name: "Трав'яний чай"
      ingredients: [FERN, FERN, SWEET_BERRIES, SWEET_BERRIES]
      power: 1.0
      seconds: 150
    ginger_tea:
      name: "Імбирний чай"
      ingredients: [SUGAR_CANE, SUGAR_CANE, HONEY_BOTTLE, GLOW_BERRIES]
      power: 1.2
      seconds: 240
    mulled_wine:
      name: "Глінтвейн"
      ingredients: [SWEET_BERRIES, SWEET_BERRIES, SUGAR, BROWN_MUSHROOM]
      power: 1.5
      seconds: 120
    coffee:
      name: "Кава"
      ingredients: [COCOA_BEANS, SUGAR, WATER_BUCKET, COCOA_BEANS]
      power: 0.8
      seconds: 90

# Котельня: спільний запас палива на групу печей (/boiler set)
boiler:
  max-members: 20              # печей у одній котельні
  max-fuel-seconds: 3600       # максимальний запас у секундах
  fixed-rate: 0                # 0 = по одній одиниці на кожну запалену піч; >0 = фіксована витрата на групу (с/с)
  fuel:
    LAVA_BUCKET: 300           # відро лави: 300 с
    COAL: 80
    CHARCOAL: 80
    BLAZE_ROD: 120
